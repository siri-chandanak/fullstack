<!DOCTYPE html>
<html>
<head>
  <title>Counter</title>
</head>
<body>

<h2>Counter: <span id="count">0</span></h2>

<button onclick="increase()">+</button>
<button onclick="decrease()">-</button>

<script>
let count = 0;

function increase() {
  count++;
  document.getElementById("count").innerText = count;
}

function decrease() {
  count--;
  document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
