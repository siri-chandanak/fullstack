<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; display:flex; height:100vh; align-items:center; justify-content:center; }
    .card { width:360px; background:#fff; border-radius:12px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
    h2 { margin:0 0 6px; }
    .sub { color:#666; margin:0 0 16px; font-size:14px; }
    label { display:block; font-size:13px; color:#333; margin:12px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:10px; outline:none; }
    input:focus { border-color:#7c5cff; box-shadow:0 0 0 3px rgba(124,92,255,0.15); }
    .row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
    .row a { font-size:13px; text-decoration:none; color:#7c5cff; }
    button { margin-top:16px; width:100%; padding:11px 12px; border:0; border-radius:10px; background:#7c5cff; color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { margin-top:12px; font-size:13px; }
    .err { color:#b00020; }
    .ok { color:#0b7a28; }
    .hint { margin-top:14px; font-size:12px; color:#777; background:#fafafa; padding:10px; border-radius:10px; border:1px dashed #e6e6e6; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Login to continue</p>

    <form id="form">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" minlength="6" required />

      <div class="row">
        <label style="display:flex; gap:8px; align-items:center; margin:10px 0 0;">
          <input id="remember" type="checkbox" style="width:auto; margin:0;" />
          Remember me
        </label>
        <a href="#" onclick="alert('Demo only 🙂')">Forgot?</a>
      </div>

      <button id="btn" type="submit">Login</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="hint">
      Demo credentials:<br/>
      <b>email:</b> demo@site.com<br/>
      <b>password:</b> password123
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    function setMessage(text, type) {
      msg.className = "msg " + (type === "ok" ? "ok" : "err");
      msg.textContent = text;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      btn.disabled = true;

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      // Demo "auth"
      setTimeout(() => {
        if (email === "demo@site.com" && password === "password123") {
          const token = "demo-token-" + Date.now();
          const remember = document.getElementById("remember").checked;

          // store token
          if (remember) localStorage.setItem("token", token);
          else sessionStorage.setItem("token", token);

          setMessage("Login successful ✅ Redirecting...", "ok");
          setTimeout(() => window.location.href = "dashboard.html", 600);
        } else {
          setMessage("Invalid email or password ❌", "err");
          btn.disabled = false;
        }
      }, 500);
    });
  </script>
</body>
</html>
