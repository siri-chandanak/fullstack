<!DOCTYPE html>
<html>
<head>
  <title>Users</title>
</head>
<body>

<h2>Users</h2>
<button onclick="loadUsers()">Load Users</button>

<ul id="users"></ul>

<script>
function loadUsers() {
  fetch("https://jsonplaceholder.typicode.com/users")
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById("users");
      list.innerHTML = "";

      data.forEach(user => {
        const li = document.createElement("li");
        li.innerText = user.name;
        list.appendChild(li);
      });
    });
}
</script>

</body>
</html>
